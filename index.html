<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZTRO</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: auto; }

  body {
    font-family: "Barlow Condensed", sans-serif;
  }

  /* Cada seção ocupa 100vh e tem sua cor */
  .section {
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: none;
  }

  /* Stage fixo que sobrepõe tudo */
  #stage {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    /* background muda via JS */
    background: #39e641;
    transition: background 0.85s cubic-bezier(0.4,0,0.2,1);
  }

  /* LOGO */
  .logo {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    height: 40px;
    width: auto;
    filter: brightness(0) invert(1);
    opacity: 0.88;
  }

  /* SHOES */
  .shoe-wrap {
    position: relative;
    width: min(580px, 88vw);
    height: min(380px, 50vh);
    margin-bottom: -8px;
  }

  .shoe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transform: translateX(50px) scale(0.94);
    transition: opacity 0.7s cubic-bezier(0.4,0,0.2,1),
                transform 0.7s cubic-bezier(0.4,0,0.2,1);
    filter: drop-shadow(0 24px 48px rgba(0,0,0,0.3));
    will-change: opacity, transform;
  }
  .shoe.active {
    opacity: 1;
    transform: translateX(0) scale(1);
    z-index: 2;
  }
  .shoe.exit {
    opacity: 0;
    transform: translateX(-50px) scale(0.94);
    z-index: 1;
  }

  /* HEADLINE */
  .headline {
    font-weight: 900;
    font-size: clamp(90px, 17vw, 190px);
    line-height: 0.82;
    color: #fff;
    letter-spacing: -3px;
    mix-blend-mode: overlay;
    text-align: center;
    user-select: none;
  }
  .tagline {
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    margin-top: 12px;
    text-align: center;
    user-select: none;
  }

  /* BADGE */
  #badge {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.15);
    backdrop-filter: blur(10px);
    padding: 8px 22px;
    border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.2);
    white-space: nowrap;
    transition: opacity 0.3s ease;
  }

  /* DOTS - pointer-events: all pra funcionar */
  .dots {
    position: fixed;
    right: 26px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 200;
    pointer-events: all;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    border: 1.5px solid rgba(255,255,255,0.6);
    cursor: pointer;
    transition: all 0.35s ease;
  }
  .dot.active {
    background: #fff;
    transform: scale(1.5);
  }

  /* DEBUG HUD */
  #hud {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    z-index: 9999;
    pointer-events: none;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="section" style="background:#1a6bff"></div>
<div class="section" style="background:#e8b800"></div>
<div class="section" style="background:#6b22d6"></div>

<!-- Dots nav (fora do stage pra ter pointer-events) -->
<nav class="dots">
  <div class="dot active" data-i="0"></div>
  <div class="dot" data-i="1"></div>
  <div class="dot" data-i="2"></div>
  <div class="dot" data-i="3"></div>

<!-- Debug HUD -->

<script>
  const stage  = document.getElementById('stage');
  const badge  = document.getElementById('badge');
  const shoes  = [s0, s1, s2, s3];
  const dots   = document.querySelectorAll('.dot');

  const COLORS = ['#39e641', '#1a6bff', '#e8b800', '#6b22d6'];
  const NAMES  = ['Verde Neon / 01', 'Azul Royal / 02', 'Amarelo Chrome / 03', 'Roxo Astral / 04'];

  let cur = 0;

  function goTo(idx) {
    if (idx === cur) return;
    const prev = cur;
    cur = idx;

    shoes[prev].classList.remove('active');
    shoes[prev].classList.add('exit');
    setTimeout(() => shoes[prev].classList.remove('exit'), 750);
    setTimeout(() => shoes[cur].classList.add('active'), 60);

    stage.style.background = COLORS[cur];

    badge.style.opacity = '0';
    setTimeout(() => {
      badge.textContent = NAMES[cur];
      badge.style.opacity = '1';
    }, 280);

    dots.forEach((d, i) => d.classList.toggle('active', i === cur));
  }

  window.addEventListener('scroll', () => {
    const scrollY  = window.scrollY;
    const docH     = document.documentElement.scrollHeight;
    const winH     = window.innerHeight;
    const maxScroll = docH - winH;                      // ex: 300vh
    const pct      = scrollY / maxScroll;               // 0 → 1
    const idx      = Math.min(3, Math.floor(pct * 4));  // 0,1,2,3


    goTo(idx);
  }, { passive: true });

  dots.forEach(d => d.addEventListener('click', () => {
    const i        = +d.dataset.i;
    const docH     = document.documentElement.scrollHeight;
    const winH     = window.innerHeight;
    const maxScroll = docH - winH;
    window.scrollTo({ top: i * (maxScroll / 3), behavior: 'smooth' });
  }));

  window.addEventListener('keydown', e => {
    const docH     = document.documentElement.scrollHeight;
    const winH     = window.innerHeight;
    const maxScroll = docH - winH;
    if (e.key === 'ArrowDown' && cur < 3)
      window.scrollTo({ top: (cur+1)*(maxScroll/3), behavior: 'smooth' });
    if (e.key === 'ArrowUp' && cur > 0)
      window.scrollTo({ top: (cur-1)*(maxScroll/3), behavior: 'smooth' });
  });
</script>
